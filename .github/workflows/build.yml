name: Run Private Python Scripts

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"

jobs:
  run:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone private repository
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          git clone \
          https://${GH_TOKEN}@github.com/leyscry/Forbidden-Scroll.git


      # ==========================================
      # 进入仓库
      # ==========================================

      - name: Enter repository
        run: |
          cd Forbidden-Scroll
          ls -la

      - name: Generate requirements.txt
        run: |
          cd Forbidden-Scroll

          pip install pipreqs

          pipreqs . \
            --force \
            --ignore .git


      - name: Install requirements
        run: |
          cd Forbidden-Scroll
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Script 1
        run: |
          cd Forbidden-Scroll
          python stablecoin_split.py


      - name: Run Script 2
        run: |
          cd Forbidden-Scroll
          python  stablecoin_whole.py
